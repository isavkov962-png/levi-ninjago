<script>
(function(){
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=680,H=320,GY=H-62;
const btn=document.getElementById('btn');

// Preload images from pre-flipped base64
function makeImgs(arr){
  return arr.map(b=>{
    const i=new Image();
    i.src='data:image/png;base64,'+b;
    return i;
  });
}
const runImgs=makeImgs(RUN_FRAMES);
const ballImgs=makeImgs(BALL_FRAMES);

// Audio
const AC=new(window.AudioContext||window.webkitAudioContext)();
function beep(freq,dur,type,vol){
  try{
    const o=AC.createOscillator(),g=AC.createGain();
    o.connect(g);g.connect(AC.destination);
    o.type=type||'sine';o.frequency.value=freq;
    g.gain.setValueAtTime(vol||0.25,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+dur);
    o.start();o.stop(AC.currentTime+dur);
  }catch(e){}
}
function sndJump(){beep(400,0.1,'sine',0.2);setTimeout(()=>beep(600,0.1,'sine',0.18),80);}
function sndRing(){beep(880,0.05,'sine',0.25);setTimeout(()=>beep(1100,0.07,'sine',0.2),50);}
function sndHit(){beep(120,0.35,'sawtooth',0.35);}
function sndSpin(){beep(300,0.07,'square',0.18);setTimeout(()=>beep(550,0.07,'square',0.18),65);}

// Game state
let gs='start'; // 'start' | 'playing' | 'paused' | 'over'
let frame=0,spd=4.8,score=0,lives=3,best=0;
let sonic={},obs=[],rings=[],parts=[],clouds=[],bgX=0,invTimer=0,jumpCount=0;

function resetState(){
  sonic={x:110,y:GY-60,vy:0,onGround:true,anim:'run',fi:0,ft:0};
  obs=[];rings=[];parts=[];frame=0;spd=4.8;
  score=0;lives=3;invTimer=0;jumpCount=0;
  document.getElementById('sc').textContent=0;
  document.getElementById('lv').textContent=3;
  document.getElementById('spd').textContent='1';
}

function startGame(){
  resetState();
  gs='playing';
  btn.textContent='↑ Прыжок';
  document.getElementById('pbtn').textContent='⏸ Пауза';
  AC.resume();
}

function doJump(){
  AC.resume();
  if(gs==='start'){startGame();return;}
  if(gs==='over'){startGame();return;}
  if(gs!=='playing')return;
  if(sonic.onGround){
    sonic.vy=-13.5;sonic.onGround=false;jumpCount=1;
    sonic.anim='run';sndJump();
  } else if(jumpCount<2){
    sonic.vy=-11;jumpCount=2;
    sonic.anim='ball';sonic.fi=0;sndSpin();
    addParts(sonic.x,sonic.y,'#4488ff',6);
  }
}

btn.addEventListener('click',doJump);
cv.addEventListener('click',doJump);
document.addEventListener('keydown',function(e){
  if(e.code==='Space'){e.preventDefault();doJump();}
  if(e.code==='KeyP'){e.preventDefault();togglePause();}
});

const pbtn=document.getElementById('pbtn');
function togglePause(){
  if(gs==='playing'){gs='paused';pbtn.textContent='▶ Продолжить';}
  else if(gs==='paused'){gs='playing';pbtn.textContent='⏸ Пауза';AC.resume();}
}
pbtn.addEventListener('click',togglePause);

function addParts(x,y,col,n){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,s=1.5+Math.random()*3.5;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,life:1,col});
  }
}

// Init clouds
for(let i=0;i<6;i++) clouds.push({x:Math.random()*W,y:25+Math.random()*55,r:15+Math.random()*20,s:0.3+Math.random()*0.25});

function drawBg(){
  // Sky
  const gr=ctx.createLinearGradient(0,0,0,H*0.75);
  gr.addColorStop(0,'#0d1a4a');gr.addColorStop(1,'#1a3a7a');
  ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);

  // Stars
  ctx.fillStyle='rgba(255,255,255,0.55)';
  [[50,18],[130,33],[210,14],[350,26],[490,17],[610,31],[660,11],[720,24]].forEach(([x,y])=>{
    const sx=((x-bgX*0.05)%(W+20)+W+20)%(W+20);
    ctx.beginPath();ctx.arc(sx,y,1,0,Math.PI*2);ctx.fill();
  });

  // Far ruins
  ctx.fillStyle='#0d2255';
  for(let i=0;i<4;i++){
    const rx=((i*220-bgX*0.08)%(W+220)+W+220)%(W+220)-110;
    ctx.fillRect(rx,H*0.3,22,H*0.45);
    ctx.fillRect(rx-12,H*0.28,46,12);
    ctx.fillRect(rx-5,H*0.22,32,8);
  }

  // Mid ruins
  ctx.fillStyle='#0a1f60';
  for(let i=0;i<3;i++){
    const rx=((i*290-bgX*0.2)%(W+290)+W+290)%(W+290)-145;
    ctx.fillRect(rx,H*0.38,30,H*0.37);
    ctx.fillRect(rx-14,H*0.36,58,10);
    ctx.fillRect(rx-7,H*0.30,44,8);
  }

  // Clouds
  ctx.fillStyle='rgba(80,120,200,0.2)';
  clouds.forEach(c=>{
    c.x-=c.s;if(c.x<-60)c.x=W+60;
    ctx.beginPath();ctx.arc(c.x,c.y,c.r,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(c.x+c.r*0.7,c.y+5,c.r*0.6,0,Math.PI*2);ctx.fill();
  });

  // Water
  const wy=GY+8;
  ctx.fillStyle='#0d2a6a';ctx.fillRect(0,wy,W,H-wy);
  ctx.strokeStyle='rgba(80,140,220,0.28)';ctx.lineWidth=1.5;
  for(let i=0;i<5;i++){
    const wx=((i*155-bgX*0.65)%(W+155)+W+155)%(W+155)-78;
    ctx.beginPath();ctx.moveTo(wx,wy+4);ctx.lineTo(wx+55,wy+4);ctx.stroke();
    ctx.beginPath();ctx.moveTo(wx+18,wy+10);ctx.lineTo(wx+75,wy+10);ctx.stroke();
  }

  // Ground stone
  ctx.fillStyle='#3a4a7a';ctx.fillRect(0,GY,W,8);
  ctx.fillStyle='#4a5a8a';ctx.fillRect(0,GY,W,3);
  ctx.strokeStyle='rgba(50,70,120,0.7)';ctx.lineWidth=1;
  for(let i=0;i<14;i++){
    const bx=((i*52-bgX)%(W+52)+W+52)%(W+52)-26;
    ctx.strokeRect(bx,GY,52,8);
  }

  // Foreground pillar stumps
  ctx.fillStyle='#1a2a50';
  for(let i=0;i<5;i++){
    const rx=((i*175-bgX*0.55)%(W+175)+W+175)%(W+175)-88;
    ctx.fillRect(rx,GY-28,16,28);
    ctx.fillRect(rx-4,GY-31,24,5);
  }
}

function drawObs(){
  obs.forEach(o=>{
    if(o.dead)return;
    if(o.type==='spike'){
      ctx.fillStyle='#7a8aaa';
      ctx.beginPath();ctx.moveTo(o.x,o.y+o.h);ctx.lineTo(o.x+o.w/2,o.y);ctx.lineTo(o.x+o.w,o.y+o.h);ctx.closePath();ctx.fill();
      ctx.fillStyle='#9aaaca';
      ctx.beginPath();ctx.moveTo(o.x+6,o.y+o.h);ctx.lineTo(o.x+o.w/2,o.y+10);ctx.lineTo(o.x+o.w-6,o.y+o.h);ctx.closePath();ctx.fill();
    } else if(o.type==='robot'){
      ctx.fillStyle='#cc4444';ctx.fillRect(o.x,o.y,o.w,o.h*0.6);
      ctx.fillStyle='#ff7777';ctx.fillRect(o.x+4,o.y+4,o.w-8,7);
      ctx.fillStyle='#ffff00';
      ctx.beginPath();ctx.arc(o.x+10,o.y+9,5,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(o.x+o.w-10,o.y+9,5,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#000';
      ctx.beginPath();ctx.arc(o.x+10,o.y+9,2.5,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(o.x+o.w-10,o.y+9,2.5,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#aa3333';
      ctx.fillRect(o.x+4,o.y+o.h*0.55,6,o.h*0.45);
      ctx.fillRect(o.x+o.w-10,o.y+o.h*0.55,6,o.h*0.45);
    } else {
      ctx.fillStyle='#3a4a7a';ctx.fillRect(o.x,o.y,o.w,o.h);
      ctx.fillStyle='#4a5a8a';ctx.fillRect(o.x+2,o.y+2,o.w-4,8);
      ctx.strokeStyle='#2a3a6a';ctx.lineWidth=1;ctx.strokeRect(o.x,o.y,o.w,o.h);
    }
  });
}

function drawRings(){
  rings.forEach(r=>{
    if(r.done)return;
    r.angle=(r.angle||0)+0.12;
    ctx.save();ctx.translate(r.x,r.y);
    const sx=Math.abs(Math.cos(r.angle))*0.65+0.35;
    ctx.scale(sx,1);
    ctx.strokeStyle='#FFD700';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(0,0,11,0,Math.PI*2);ctx.stroke();
    ctx.strokeStyle='rgba(255,240,100,0.5)';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(-3,-3,5,0.5,2.2);ctx.stroke();
    ctx.restore();
  });
}

function drawSonic(){
  if(invTimer>0 && Math.floor(invTimer/5)%2===0) return;
  const s=sonic;
  const imgs=s.anim==='ball'?ballImgs:runImgs;
  const fi=Math.floor(s.fi)%imgs.length;
  const im=imgs[fi];
  if(im && im.complete && im.naturalWidth>0){
    const dh=s.anim==='ball'?56:72;
    const dw=Math.round(im.naturalWidth*(dh/im.naturalHeight));
    ctx.drawImage(im, s.x - dw/2, s.y - dh, dw, dh);
    if(s.onGround){
      ctx.fillStyle='rgba(0,0,0,0.18)';
      ctx.beginPath();ctx.ellipse(s.x,GY+2,18,4,0,0,Math.PI*2);ctx.fill();
    }
  } else {
    ctx.fillStyle='#1A4DB8';
    ctx.beginPath();ctx.arc(s.x,s.y-28,20,0,Math.PI*2);ctx.fill();
  }
}

function drawParts(){
  parts.forEach(p=>{
    ctx.globalAlpha=Math.max(0,p.life);
    ctx.fillStyle=p.col;
    ctx.beginPath();ctx.arc(p.x,p.y,4*p.life,0,Math.PI*2);ctx.fill();
  });
  ctx.globalAlpha=1;
}

function hitRect(sx,sy,sr,rx,ry,rw,rh){
  return sx+sr>rx && sx-sr<rx+rw && sy+sr>ry && sy-sr<ry+rh;
}

function update(){
  frame++;bgX+=spd;

  // Spawn
  if(frame%95===0){
    const types=['spike','pillar','robot'];
    const t=types[Math.floor(Math.random()*types.length)];
    const h=t==='spike'?40:t==='robot'?38:44+Math.random()*20;
    const w=t==='robot'?42:30;
    obs.push({x:W+20,y:GY-h,w,h,type:t,dead:false});
  }
  if(frame%62===0){
    const ry=GY-55-Math.random()*90;
    rings.push({x:W+20,y:ry,done:false});
    if(Math.random()<0.4) rings.push({x:W+55,y:ry-15,done:false});
  }
  if(frame%250===0 && spd<10){
    spd+=0.5;
    document.getElementById('spd').textContent=Math.round((spd-4.3)/0.5);
  }

  // Physics
  sonic.vy+=0.7;sonic.y+=sonic.vy;
  if(sonic.y>=GY-55){
    sonic.y=GY-55;sonic.vy=0;
    if(!sonic.onGround){sonic.onGround=true;jumpCount=0;sonic.anim='run';}
  }

  // Animate
  sonic.ft++;
  if(sonic.ft>=(sonic.anim==='ball'?2:3)){sonic.ft=0;sonic.fi++;}

  if(invTimer>0) invTimer--;

  obs=obs.filter(o=>o.x+o.w>-10);
  obs.forEach(o=>{o.x-=spd;});
  rings=rings.filter(r=>r.x>-20);
  rings.forEach(r=>{r.x-=spd;});

  // Collision - obstacles
  obs.forEach(o=>{
    if(o.dead) return;
    if(invTimer===0 && hitRect(sonic.x,sonic.y-30,20,o.x,o.y,o.w,o.h)){
      if(sonic.anim==='ball' && o.type==='robot'){
        o.dead=true;
        addParts(o.x+o.w/2,o.y+o.h/2,'#ff6644',12);
        return;
      }
      lives--;invTimer=80;
      addParts(sonic.x,sonic.y-28,'#EF5350',12);
      sndHit();
      document.getElementById('lv').textContent=Math.max(0,lives);
      if(lives<=0){
        gs='over';
        btn.textContent='🔄 Снова';
      }
    }
  });

  // Collision - rings
  rings.forEach(r=>{
    if(!r.done && Math.hypot(r.x-sonic.x, r.y-(sonic.y-28))<34){
      r.done=true;score++;
      if(score>best) best=score;
      document.getElementById('sc').textContent=score;
      document.getElementById('bst').textContent=best;
      addParts(r.x,r.y,'#FFD700',7);
      sndRing();
    }
  });

  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.15;p.life-=0.032;});
  parts=parts.filter(p=>p.life>0);
}

function drawGameOver(){
  ctx.fillStyle='rgba(0,0,30,0.7)';ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.fillStyle='#fff';ctx.font='bold 30px Arial';
  ctx.fillText('💀 Гра закінчена!',W/2,H/2-22);
  ctx.fillStyle='#FFD700';ctx.font='18px Arial';
  ctx.fillText('Кілець: '+score+'   Рекорд: '+best,W/2,H/2+14);
  ctx.fillStyle='#aabbff';ctx.font='14px Arial';
  ctx.fillText('Натисни кнопку або ПРОБЕЛ — знову',W/2,H/2+44);
  ctx.textAlign='start';
}

function drawStartScreen(){
  ctx.fillStyle='rgba(255,255,255,0.93)';
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(W/2-190,H/2-52,380,90,14);
  else ctx.rect(W/2-190,H/2-52,380,90);
  ctx.fill();
  ctx.fillStyle='#1A4DB8';ctx.font='bold 22px Arial';ctx.textAlign='center';
  ctx.fillText('🦔 Sonic Runner для Лєві!',W/2,H/2-16);
  ctx.fillStyle='#555';ctx.font='14px Arial';
  ctx.fillText('Пробел / клик — прыжок  |  2× — спін-атака!',W/2,H/2+12);
  ctx.textAlign='start';
}

function loop(){
  ctx.clearRect(0,0,W,H);
  drawBg();

  if(gs==='start'){
    // Sonic idle on start screen
    sonic.ft++;
    if(sonic.ft>=4){sonic.ft=0;sonic.fi++;}
    drawSonic();
    drawStartScreen();
  } else if(gs==='playing'){
    update();
    // Only draw game elements if still playing (update may set gs='over')
    drawObs();
    drawRings();
    drawParts();
    drawSonic();
  } else if(gs==='paused'){
    drawObs();drawRings();drawParts();drawSonic();
    ctx.fillStyle='rgba(0,0,30,0.55)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';
    ctx.fillStyle='#fff';ctx.font='bold 32px Arial';ctx.fillText('⏸ ПАУЗА',W/2,H/2-10);
    ctx.fillStyle='#aabbff';ctx.font='16px Arial';ctx.fillText('Нажми P или кнопку — продолжить',W/2,H/2+26);
    ctx.textAlign='start';
  } else if(gs==='over'){
    // Frozen scene
    drawObs();
    drawRings();
    drawParts();
    drawSonic();
    drawGameOver();
  }

  requestAnimationFrame(loop);
}

// Init sonic for start screen
resetState();
loop();
})();
</script>
