<script>
(function(){
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=720,H=360;
const GY=H-70; // ground y (top of ground)
const btn=document.getElementById('btn'),pbtn=document.getElementById('pbtn');

// Preload sonic sprites
function mkImgs(arr){return arr.map(b=>{const i=new Image();i.src='data:image/png;base64,'+b;return i;});}
const runImgs=mkImgs(RUN_FRAMES);
const ballImgs=mkImgs(BALL_FRAMES);

// Audio
const AC=new(window.AudioContext||window.webkitAudioContext)();
function beep(f,d,t,v){try{const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);o.type=t||'sine';o.frequency.value=f;g.gain.setValueAtTime(v||0.2,AC.currentTime);g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+d);o.start();o.stop(AC.currentTime+d);}catch(e){}}
function sndJump(){beep(400,.1,'sine',.2);setTimeout(()=>beep(600,.1,'sine',.18),80);}
function sndRing(){beep(880,.05,'sine',.25);setTimeout(()=>beep(1100,.07,'sine',.2),50);}
function sndHit(){beep(120,.35,'sawtooth',.35);}
function sndSpin(){beep(300,.07,'square',.18);setTimeout(()=>beep(550,.07,'square',.18),65);}

// State
let gs='start',frame=0,spd=3.5,score=0,lives=3,best=0;
let sonic={},obs=[],rings=[],parts=[],clouds=[],bgX=0,invTimer=0,jumpCount=0;

// Platforms: array of {x,y,w,h}
let platforms=[];

function resetState(){
  sonic={x:130,y:GY-100,vy:0,onGround:true,anim:'run',fi:0,ft:0};
  obs=[];rings=[];parts=[];frame=0;spd=3.5;
  score=0;lives=5;invTimer=0;jumpCount=0;
  platforms=[];
  document.getElementById('sc').textContent=0;
  document.getElementById('lv').textContent=3;
  document.getElementById('spd').textContent='1';
}

function startGame(){resetState();gs='playing';btn.textContent='↑ Прыжок';pbtn.textContent='⏸ Пауза';AC.resume();}

function doJump(){
  AC.resume();
  if(gs==='start'||gs==='over'){startGame();return;}
  if(gs==='paused'){togglePause();return;}
  if(gs!=='playing')return;
  if(sonic.onGround){sonic.vy=-15;sonic.onGround=false;jumpCount=1;sonic.anim='run';sndJump();}
  else if(jumpCount<2){sonic.vy=-12;jumpCount=2;sonic.anim='ball';sonic.fi=0;sndSpin();addParts(sonic.x,sonic.y,'#4488ff',6);}
}

function togglePause(){
  if(gs==='playing'){gs='paused';pbtn.textContent='▶ Продолжить';}
  else if(gs==='paused'){gs='playing';pbtn.textContent='⏸ Пауза';AC.resume();}
}

btn.addEventListener('click',doJump);
cv.addEventListener('click',doJump);
pbtn.addEventListener('click',togglePause);
document.addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();doJump();}
  if(e.code==='KeyP'){e.preventDefault();togglePause();}
});

function addParts(x,y,col,n){
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=1.5+Math.random()*3.5;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,life:1,col});}
}

// Init clouds
for(let i=0;i<7;i++) clouds.push({x:Math.random()*W,y:20+Math.random()*60,r:15+Math.random()*22,s:.3+Math.random()*.25});

// ===== DRAW BACKGROUND (Aquatic Ruin) =====
function drawBg(){
  const gr=ctx.createLinearGradient(0,0,0,H*.8);
  gr.addColorStop(0,'#080f30');gr.addColorStop(1,'#122060');
  ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);

  // Stars
  ctx.fillStyle='rgba(255,255,255,0.5)';
  [[50,18],[130,33],[220,14],[360,26],[500,17],[620,31],[680,11]].forEach(([x,y])=>{
    ctx.beginPath();ctx.arc(((x-bgX*.04)%W+W)%W,y,1,0,Math.PI*2);ctx.fill();
  });

  // Far ruins (very slow)
  ctx.fillStyle='#0a1840';
  for(let i=0;i<5;i++){
    const rx=((i*200-bgX*.07)%(W+200)+W+200)%(W+200)-100;
    ctx.fillRect(rx,H*.28,24,H*.48);
    ctx.fillRect(rx-14,H*.26,52,13);
    ctx.fillRect(rx-6,H*.20,36,9);
  }

  // Mid ruins (medium speed)
  ctx.fillStyle='#091850';
  for(let i=0;i<4;i++){
    const rx=((i*260-bgX*.18)%(W+260)+W+260)%(W+260)-130;
    ctx.fillRect(rx,H*.35,32,H*.40);
    ctx.fillRect(rx-16,H*.33,64,11);
    ctx.fillRect(rx-8,H*.27,48,9);
    // crumbled top
    ctx.fillRect(rx+2,H*.21,11,8);
    ctx.fillRect(rx+20,H*.23,10,6);
  }

  // Clouds (wispy)
  ctx.fillStyle='rgba(70,110,200,.18)';
  clouds.forEach(c=>{c.x-=c.s;if(c.x<-70)c.x=W+70;ctx.beginPath();ctx.arc(c.x,c.y,c.r,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(c.x+c.r*.7,c.y+6,c.r*.6,0,Math.PI*2);ctx.fill();});

  // Water
  const wy=GY+10;
  ctx.fillStyle='#071a55';ctx.fillRect(0,wy,W,H-wy);
  ctx.strokeStyle='rgba(60,130,220,.25)';ctx.lineWidth=1.5;
  for(let i=0;i<6;i++){
    const wx=((i*140-bgX*.6)%(W+140)+W+140)%(W+140)-70;
    ctx.beginPath();ctx.moveTo(wx,wy+5);ctx.lineTo(wx+50,wy+5);ctx.stroke();
    ctx.beginPath();ctx.moveTo(wx+16,wy+11);ctx.lineTo(wx+68,wy+11);ctx.stroke();
  }

  // Ground
  const gg=ctx.createLinearGradient(0,GY,0,GY+10);
  gg.addColorStop(0,'#3a4a8a');gg.addColorStop(1,'#1e2a5a');
  ctx.fillStyle=gg;ctx.fillRect(0,GY,W,10);
  ctx.fillStyle='#4a5a9a';ctx.fillRect(0,GY,W,3);
  // Stone blocks
  ctx.strokeStyle='rgba(40,60,120,.6)';ctx.lineWidth=1;
  for(let i=0;i<15;i++){const bx=((i*50-bgX)%(W+50)+W+50)%(W+50)-25;ctx.strokeRect(bx,GY,50,10);}

  // Foreground pillar stumps (fast)
  ctx.fillStyle='#141e44';
  for(let i=0;i<6;i++){
    const rx=((i*160-bgX*.5)%(W+160)+W+160)%(W+160)-80;
    ctx.fillRect(rx,GY-32,18,32);
    ctx.fillRect(rx-4,GY-36,26,6);
  }
}

// ===== DRAW PLATFORMS =====
function drawPlatforms(){
  platforms.forEach(p=>{
    if(p.x+p.w<0) return;
    ctx.fillStyle='#2a3a7a';ctx.fillRect(p.x,p.y,p.w,p.h);
    ctx.fillStyle='#4a6aaa';ctx.fillRect(p.x,p.y,p.w,4);
    ctx.strokeStyle='#1a2a5a';ctx.lineWidth=1;ctx.strokeRect(p.x,p.y,p.w,p.h);
    // stone details
    for(let i=0;i<Math.floor(p.w/30);i++){ctx.strokeRect(p.x+i*30,p.y,30,p.h);}
  });
}

// ===== DRAW OBSTACLES / ENEMIES =====
function drawObs(){
  obs.forEach(o=>{
    if(o.dead||o.x+o.w<0) return;
    if(o.type==='spike'){
      ctx.fillStyle='#7a8aaa';
      ctx.beginPath();ctx.moveTo(o.x,o.y+o.h);ctx.lineTo(o.x+o.w/2,o.y);ctx.lineTo(o.x+o.w,o.y+o.h);ctx.closePath();ctx.fill();
      ctx.fillStyle='#9aaaca';
      ctx.beginPath();ctx.moveTo(o.x+7,o.y+o.h);ctx.lineTo(o.x+o.w/2,o.y+10);ctx.lineTo(o.x+o.w-7,o.y+o.h);ctx.closePath();ctx.fill();
    } else if(o.type==='motobug'){
      // Draw Motobug with code - red body, blue head, wheel
      const cx=o.x+o.w/2, cy=o.y+o.h/2;
      // Wheel
      ctx.fillStyle='#333';ctx.beginPath();ctx.arc(cx,cy+8,14,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#555';ctx.lineWidth=3;ctx.beginPath();ctx.arc(cx,cy+8,14,0,Math.PI*2);ctx.stroke();
      // Wheel spokes (animated)
      ctx.strokeStyle='#666';ctx.lineWidth=2;
      const spoke=frame*.15;
      for(let s=0;s<4;s++){const a=spoke+s*Math.PI/2;ctx.beginPath();ctx.moveTo(cx,cy+8);ctx.lineTo(cx+Math.cos(a)*13,cy+8+Math.sin(a)*13);ctx.stroke();}
      // Body (red shell)
      ctx.fillStyle='#cc2222';ctx.beginPath();ctx.ellipse(cx,cy-4,22,16,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#ee4444';ctx.beginPath();ctx.ellipse(cx-3,cy-8,14,8,-.2,0,Math.PI*2);ctx.fill();
      // Black stripe
      ctx.fillStyle='#111';ctx.beginPath();ctx.ellipse(cx,cy-2,22,4,0,0,Math.PI*2);ctx.fill();
      // Head (blue)
      ctx.fillStyle='#2244cc';ctx.beginPath();ctx.arc(cx+18,cy-4,12,0,Math.PI*2);ctx.fill();
      // Eyes
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(cx+22,cy-6,5,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#111';ctx.beginPath();ctx.arc(cx+23,cy-6,2.5,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(cx+24,cy-7,1,0,Math.PI*2);ctx.fill();
      // Antennae
      ctx.strokeStyle='#FFD700';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.moveTo(cx+18,cy-16);ctx.lineTo(cx+16,cy-24);ctx.stroke();
      ctx.beginPath();ctx.moveTo(cx+22,cy-16);ctx.lineTo(cx+26,cy-24);ctx.stroke();
      ctx.fillStyle='#FFD700';
      ctx.beginPath();ctx.arc(cx+16,cy-25,3,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(cx+26,cy-25,3,0,Math.PI*2);ctx.fill();
      // Stinger tail
      ctx.fillStyle='#888';ctx.beginPath();ctx.moveTo(cx-20,cy-4);ctx.lineTo(cx-30,cy-1);ctx.lineTo(cx-20,cy+2);ctx.closePath();ctx.fill();
    } else {
      // Stone pillar
      ctx.fillStyle='#2a3a6a';ctx.fillRect(o.x,o.y,o.w,o.h);
      ctx.fillStyle='#3a4a8a';ctx.fillRect(o.x+2,o.y+2,o.w-4,10);
      ctx.strokeStyle='#1a2a5a';ctx.lineWidth=1;ctx.strokeRect(o.x,o.y,o.w,o.h);
    }
  });
}

// ===== DRAW RINGS =====
function drawRings(){
  rings.forEach(r=>{
    if(r.done)return;
    r.angle=(r.angle||0)+.12;
    ctx.save();ctx.translate(r.x,r.y);
    ctx.scale(Math.abs(Math.cos(r.angle))*.6+.4,1);
    ctx.strokeStyle='#FFD700';ctx.lineWidth=3.5;
    ctx.beginPath();ctx.arc(0,0,12,0,Math.PI*2);ctx.stroke();
    ctx.strokeStyle='rgba(255,240,80,.5)';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(-3,-3,5,.5,2.2);ctx.stroke();
    ctx.restore();
  });
}

// ===== DRAW SONIC =====
function drawSonic(){
  if(invTimer>0&&Math.floor(invTimer/5)%2===0)return;
  const s=sonic;
  const imgs=s.anim==='ball'?ballImgs:runImgs;
  const fi=Math.floor(s.fi)%imgs.length;
  const im=imgs[fi];
  if(im&&im.complete&&im.naturalWidth>0){
    const dh=s.anim==='ball'?90:120;
    const dw=Math.round(im.naturalWidth*(dh/im.naturalHeight));
    ctx.drawImage(im,s.x-dw/2,s.y-dh,dw,dh);
    if(s.onGround){ctx.fillStyle='rgba(0,0,0,.18)';ctx.beginPath();ctx.ellipse(s.x,GY+2,24,5,0,0,Math.PI*2);ctx.fill();}
  } else {
    ctx.fillStyle='#1A4DB8';ctx.beginPath();ctx.arc(s.x,s.y-30,25,0,Math.PI*2);ctx.fill();
  }
}

// ===== DRAW PARTICLES =====
function drawParts(){
  parts.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,4*p.life,0,Math.PI*2);ctx.fill();});
  ctx.globalAlpha=1;
}

// ===== COLLISION HELPERS =====
function hitRect(sx,sy,sr,rx,ry,rw,rh){return sx+sr>rx&&sx-sr<rx+rw&&sy+sr>ry&&sy-sr<ry+rh;}

function onPlatform(s,p){
  // Check if Sonic lands on top of platform
  return s.x+15>p.x && s.x-15<p.x+p.w &&
         s.y>p.y-5 && s.y<=p.y+8 && s.vy>=0;
}

// ===== UPDATE =====
function update(){
  frame++;bgX+=spd;

  // Spawn obstacles
  if(frame%160===0){
    const types=['spike','motobug','pillar'];
    const t=types[Math.floor(Math.random()*types.length)];
    const h=t==='spike'?44:t==='motobug'?52:50+Math.random()*20;
    const w=t==='motobug'?60:34;
    // Spawn on ground or on a platform?
    const useGround=Math.random()<0.7;
    const spawnY=useGround?GY-h:GY-h-80-Math.random()*60;
    obs.push({x:W+30,y:spawnY,w,h,type:t,dead:false});
  }

  // Spawn rings
  if(frame%45===0){
    const ry=GY-70-Math.random()*80;
    rings.push({x:W+20,y:ry,done:false});
    if(Math.random()<.5) rings.push({x:W+55,y:ry-20,done:false});
  }

  // Spawn platforms
  if(frame%160===0){
    const pw=80+Math.random()*60;
    const ph=14;
    const py=GY-90-Math.random()*100;
    platforms.push({x:W+20,y:py,w:pw,h:ph});
  }

  // Speed up
  if(frame%400===0&&spd<8){spd+=.3;document.getElementById('spd').textContent=Math.round((spd-4.3)/.5);}

  // Sonic physics
  sonic.vy+=.75;sonic.y+=sonic.vy;

  // Ground collision
  if(sonic.y>=GY){
    sonic.y=GY;sonic.vy=0;
    if(!sonic.onGround){sonic.onGround=true;jumpCount=0;sonic.anim='run';}
  }

  // Platform collisions
  sonic.onGround=sonic.y>=GY;
  platforms.forEach(p=>{
    if(onPlatform(sonic,p)){
      sonic.y=p.y;sonic.vy=0;sonic.onGround=true;jumpCount=0;sonic.anim='run';
    }
  });

  // Animate
  sonic.ft++;
  if(sonic.ft>=(sonic.anim==='ball'?2:3)){sonic.ft=0;sonic.fi++;}
  if(invTimer>0) invTimer--;

  // Move everything
  obs=obs.filter(o=>o.x+o.w>-20);obs.forEach(o=>{o.x-=spd;});
  rings=rings.filter(r=>r.x>-20);rings.forEach(r=>{r.x-=spd;});
  platforms=platforms.filter(p=>p.x+p.w>-20);platforms.forEach(p=>{p.x-=spd;});

  // Motobug movement (oscillate slightly)
  obs.forEach(o=>{if(o.type==='motobug'&&!o.dead) o.y=o.y+(Math.sin(frame*.08+o.x*.01)*.5);});

  // Collisions: obstacles
  obs.forEach(o=>{
    if(o.dead)return;
    if(invTimer===0&&hitRect(sonic.x,sonic.y-40,18,o.x,o.y,o.w,o.h)){
      if(sonic.anim==='ball'&&o.type==='motobug'){
        o.dead=true;addParts(o.x+o.w/2,o.y+o.h/2,'#ff6644',14);
        sonic.vy=-8;return;
      }
      lives--;invTimer=140;addParts(sonic.x,sonic.y-40,'#EF5350',14);sndHit();
      document.getElementById('lv').textContent=Math.max(0,lives);
      if(lives<=0){gs='over';btn.textContent='🔄 Снова';}
    }
  });

  // Collisions: rings
  rings.forEach(r=>{
    if(!r.done&&Math.hypot(r.x-sonic.x,r.y-(sonic.y-40))<38){
      r.done=true;score++;if(score>best)best=score;
      document.getElementById('sc').textContent=score;
      document.getElementById('bst').textContent=best;
      addParts(r.x,r.y,'#FFD700',8);sndRing();
    }
  });

  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.15;p.life-=.03;});
  parts=parts.filter(p=>p.life>0);
}

// ===== OVERLAYS =====
function drawGameOver(){
  ctx.fillStyle='rgba(0,0,20,.72)';ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.fillStyle='#fff';ctx.font='bold 32px Arial';ctx.fillText('💀 Гра закінчена!',W/2,H/2-24);
  ctx.fillStyle='#FFD700';ctx.font='20px Arial';ctx.fillText('Кілець: '+score+'   Рекорд: '+best,W/2,H/2+14);
  ctx.fillStyle='#aabbff';ctx.font='15px Arial';ctx.fillText('Натисни кнопку або ПРОБЕЛ — знову',W/2,H/2+48);
  ctx.textAlign='start';
}

function drawPause(){
  ctx.fillStyle='rgba(0,0,20,.6)';ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.fillText('⏸ ПАУЗА',W/2,H/2-12);
  ctx.fillStyle='#aabbff';ctx.font='16px Arial';ctx.fillText('Натисни P або кнопку — продовжити',W/2,H/2+28);
  ctx.textAlign='start';
}

function drawStart(){
  ctx.fillStyle='rgba(255,255,255,.93)';
  ctx.beginPath();if(ctx.roundRect)ctx.roundRect(W/2-200,H/2-56,400,96,14);else ctx.rect(W/2-200,H/2-56,400,96);ctx.fill();
  ctx.fillStyle='#1A4DB8';ctx.font='bold 23px Arial';ctx.textAlign='center';
  ctx.fillText('🦔 Sonic Runner для Лєві!',W/2,H/2-18);
  ctx.fillStyle='#444';ctx.font='14px Arial';
  ctx.fillText('Пробел / клик — прыжок  |  2× — спін-атака!',W/2,H/2+10);
  ctx.fillStyle='#888';ctx.font='13px Arial';
  ctx.fillText('Спін-атакою можна знищити Motobug!',W/2,H/2+30);
  ctx.textAlign='start';
}

// ===== MAIN LOOP =====
function loop(){
  ctx.clearRect(0,0,W,H);
  drawBg();
  drawPlatforms();

  if(gs==='playing'){
    update();
    if(gs==='playing'){drawObs();drawRings();drawParts();drawSonic();}
    else{drawObs();drawRings();drawParts();drawSonic();drawGameOver();}
  } else if(gs==='start'){
    sonic.ft++;if(sonic.ft>=4){sonic.ft=0;sonic.fi++;}
    drawSonic();drawStart();
  } else if(gs==='paused'){
    drawObs();drawRings();drawParts();drawSonic();drawPause();
  } else if(gs==='over'){
    drawObs();drawRings();drawParts();drawSonic();drawGameOver();
  }
  requestAnimationFrame(loop);
}

resetState();loop();
})();
</script>
