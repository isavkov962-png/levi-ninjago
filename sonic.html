    document.getElementById('lv').textContent=3;
    gs='playing'; btn.textContent='↑ Прыжок';
  }

  function jump(){
    if(gs==='start'||gs==='over'){reset();return;}
    if(gs==='playing'&&sonic.onGround){sonic.vy=-13;sonic.onGround=false;}
  }
  btn.addEventListener('click',jump);
  cv.addEventListener('click',jump);
  document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();jump();}});

  function addParts(x,y,col,n){
    for(let i=0;i<n;i++){
      const a=Math.random()*Math.PI*2,s=2+Math.random()*4;
      parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,life:1,col});
    }
  }

  function drawSonic(x,y,air){
    if(imgReady){
      const sw=64, sh=64;
      ctx.save();
      // Flip horizontally so Sonic faces right
      ctx.translate(x + sw/2, y - sh/2);
      ctx.scale(-1,1);
      ctx.drawImage(img, -sw/2, -sh/2, sw, sh);
      ctx.restore();
      // Shadow on ground
      if(!air){
        ctx.fillStyle='rgba(0,0,0,0.22)';
        ctx.beginPath();ctx.ellipse(x,GY+3,20,5,0,0,Math.PI*2);ctx.fill();
      }
    } else {
      ctx.fillStyle='#1A4DB8';
      ctx.beginPath();ctx.arc(x,y,22,0,Math.PI*2);ctx.fill();
    }
  }

  function drawBg(){
    const gr=ctx.createLinearGradient(0,0,0,H);
    gr.addColorStop(0,'#5BB8F5');gr.addColorStop(1,'#A8DFF8');
    ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
    ctx.fillStyle='rgba(255,255,255,0.85)';
    [[80,40,30],[210,52,22],[380,38,26],[530,46,20]].forEach(([cx,cy,r])=>{
      const x=((cx-bgX*0.18)%(W+80)+W+80)%(W+80)-40;
      ctx.beginPath();ctx.arc(x,cy,r,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(x+r*.6,cy+5,r*.65,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(x-r*.55,cy+6,r*.55,0,Math.PI*2);ctx.fill();
    });
    ctx.fillStyle='#5FAD3A';
    for(let i=0;i<5;i++){
      const hx=((i*160-bgX*0.35)%(W+180)+W+180)%(W+180)-80;
      ctx.beginPath();ctx.arc(hx,GY+8,70,Math.PI,0);ctx.fill();
    }
    ctx.fillStyle='#78C840';ctx.fillRect(0,GY,W,H-GY);
    ctx.fillStyle='#5A9E28';ctx.fillRect(0,GY,W,5);
    ctx.fillStyle='#6BBF35';
    for(let i=0;i<8;i++){
      const sx=((i*90-bgX)%(W+100)+W+100)%(W+100)-50;
      ctx.fillRect(sx,GY+8,40,3);
    }
  }

  function drawObs(){
    obs.forEach(o=>{
      if(o.type==='spike'){
        ctx.fillStyle='#E64A19';
        ctx.beginPath();ctx.moveTo(o.x,o.y+o.h);ctx.lineTo(o.x+o.w/2,o.y);ctx.lineTo(o.x+o.w,o.y+o.h);ctx.closePath();ctx.fill();
        ctx.fillStyle='#BF360C';
        ctx.beginPath();ctx.moveTo(o.x+7,o.y+o.h);ctx.lineTo(o.x+o.w/2,o.y+10);ctx.lineTo(o.x+o.w-7,o.y+o.h);ctx.closePath();ctx.fill();
      } else {
        ctx.fillStyle='#795548';ctx.fillRect(o.x,o.y,o.w,o.h);
        ctx.fillStyle='#5D4037';ctx.fillRect(o.x+2,o.y+2,o.w-4,10);
        ctx.strokeStyle='#4E342E';ctx.lineWidth=1.5;ctx.strokeRect(o.x,o.y,o.w,o.h);
        ctx.strokeStyle='#8D6E63';ctx.lineWidth=1;
        ctx.beginPath();ctx.moveTo(o.x+4,o.y+4);ctx.lineTo(o.x+o.w-4,o.y+o.h-4);ctx.stroke();
        ctx.beginPath();ctx.moveTo(o.x+o.w-4,o.y+4);ctx.lineTo(o.x+4,o.y+o.h-4);ctx.stroke();
      }
    });
  }

  function drawRings(){
    rings.forEach(r=>{
      if(r.done)return;
      ctx.save();ctx.translate(r.x,r.y);
      const p=0.85+0.15*Math.sin(frame*0.12+r.x*0.05);
      ctx.strokeStyle='#FFD700';ctx.lineWidth=3.5*p;
      ctx.beginPath();ctx.arc(0,0,11*p,0,Math.PI*2);ctx.stroke();
      ctx.strokeStyle='rgba(255,255,180,0.7)';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.arc(-3,-3,4,0.5,2.2);ctx.stroke();
      ctx.restore();
    });
  }

  function drawParts(){
    parts.forEach(p=>{
      ctx.globalAlpha=Math.max(0,p.life);
      ctx.fillStyle=p.col;
      ctx.beginPath();ctx.arc(p.x,p.y,5*p.life,0,Math.PI*2);ctx.fill();
    });
    ctx.globalAlpha=1;
  }

  function hitRect(sx,sy,sr,rx,ry,rw,rh){
    return sx+sr>rx&&sx-sr<rx+rw&&sy+sr>ry&&sy-sr<ry+rh;
  }

  function update(){
    frame++;bgX+=spd;
    if(frame%90===0){
      const t=Math.random()<0.5?'spike':'box';
      const h=t==='spike'?38:38+Math.random()*22;
      obs.push({x:W+20,y:GY-h,w:30,h,type:t});
    }
    if(frame%58===0) rings.push({x:W+20,y:GY-55-Math.random()*80,done:false});
    if(frame%220===0&&spd<9) spd+=0.4;

    sonic.vy+=0.65;sonic.y+=sonic.vy;
    if(sonic.y>=GY-38){sonic.y=GY-38;sonic.vy=0;sonic.onGround=true;}
    if(invTimer>0)invTimer--;

    obs=obs.filter(o=>o.x+o.w>-10);obs.forEach(o=>{o.x-=spd;});
    rings=rings.filter(r=>r.x>-20);rings.forEach(r=>{r.x-=spd;});

    obs.forEach(o=>{
      if(invTimer===0&&hitRect(sonic.x,sonic.y,22,o.x,o.y,o.w,o.h)){
        lives--;invTimer=70;addParts(sonic.x,sonic.y,'#EF5350',14);
        document.getElementById('lv').textContent=Math.max(0,lives);
        if(lives<=0){gs='over';btn.textContent='🔄 Снова';}
      }
    });
    rings.forEach(r=>{
      if(!r.done&&Math.hypot(r.x-sonic.x,r.y-sonic.y)<34){
        r.done=true;score++;if(score>best)best=score;
        document.getElementById('sc').textContent=score;
        document.getElementById('bst').textContent=best;
        addParts(r.x,r.y,'#FFD700',9);
      }
    });
    parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.12;p.life-=0.035;});
    parts=parts.filter(p=>p.life>0);
  }

  function drawOverlay(msg,sub){
    ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';
    ctx.font='bold 26px Arial';ctx.fillText(msg,W/2,H/2-18);
    ctx.font='16px Arial';ctx.fillStyle='#FFD700';
    ctx.fillText(sub,W/2,H/2+14);ctx.textAlign='start';
  }

  function drawStart(){
    ctx.fillStyle='rgba(255,255,255,0.92)';
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(W/2-180,H/2-48,360,86,12);
    else ctx.rect(W/2-180,H/2-48,360,86);
    ctx.fill();
    ctx.fillStyle='#1A4DB8';ctx.font='bold 20px Arial';ctx.textAlign='center';
    ctx.fillText('🦔 Sonic Runner для Лєві!',W/2,H/2-14);
    ctx.fillStyle='#555';ctx.font='14px Arial';
    ctx.fillText('Пробел / клик / кнопка — прыжок',W/2,H/2+14);
    ctx.textAlign='start';
  }

  function loop(){
    ctx.clearRect(0,0,W,H);
    drawBg();
    drawObs();drawRings();drawParts();
    if(gs==='playing'){
      update();
      const blink=invTimer>0&&Math.floor(invTimer/6)%2===0;
      if(!blink) drawSonic(sonic.x,sonic.y,!sonic.onGround);
    } else if(gs==='start'){
      drawSonic(90,GY-38,false);
      drawStart();
    } else if(gs==='over'){
      drawSonic(sonic.x,sonic.y,!sonic.onGround);
      drawOverlay('💀 Игра окончена!','Колец: '+score+' | Нажми кнопку — снова');
    }
    requestAnimationFrame(loop);
  }
  loop();
})();
</script>
</body>
</html>
